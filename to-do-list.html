<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<style>
    * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    color: white;
}
    body{

       
        
        background:url(image/wallpaper-iamge.jpg);
        background-size: cover;
        background-repeat: no-repeat;
        min-height: 100vh;
        justify-content: center;
        align-items: center;
        padding: 20px;
        backdrop-filter: blur(5px);
    }
    .container{
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        height: 50px;
    }
    .add{
        padding: 10px;
        border-radius: 5px;
        background-color: rgb(39, 184, 99);
        color: white;
        border: none;
        width: 100px;
        cursor: pointer;
        height: 40px;
        
    }
    input{
        padding: 10px;
        border-radius: 5px;
        border: none;
        width: 200px;
        height: 40px;
        color: black;
    }
.list-item{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    justify-content: center;
    align-items: center;
}
.edit{
    cursor: pointer;
    margin-left: 100px;
}
.delete{
    cursor: pointer;
}
    
</style>
<body>
    <div class="container">
        <input type="text" placeholder="Enter your program" class="input">
        <input type="date" class="date" placeholder="mm/dd/yyyy">
        <button class="add">Add</button>
    </div>
    <div class="list">
    </div>


</body>
<script src="to-do-list.js"></script>
</html>
